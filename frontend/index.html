<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyTicket Generator</title>
    <meta name="description" content="A flight ticket generator that allows users to input flight details and export a high-quality PDF ticket in a specific layout." />
    <meta property="og:title" content="SkyTicket Generator" />
    <meta property="og:description" content="A flight ticket generator that allows users to input flight details and export a high-quality PDF ticket in a specific layout." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%230b74de' d='M57 14 7 30l17 7 7 17z'/%3E%3C/svg%3E">
    <style>
      /* Hide scrollbar for clean UI */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
    </style>
    <script>
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          String(event.reason).includes('WebSocket') || 
          String(event.reason?.message).includes('WebSocket')
        )) {
          event.preventDefault();
        }
      });
    </script>
</head>
  <body class="bg-gray-100 text-gray-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
